openapi: 3.0.3
info:
  title: Yanki V2
  version: '1.0'
  description: 'New routes for the added study reminder requirements. '
tags:
  - name: Study Reminders
  - name: Courses
servers:
  - url: https://yanki.app
paths:
  /v2/studyReminders:
    post:
      tags: [Study Reminders]
      summary: Create a new study reminder
      description: Create a new study reminder with a name, description and due date for an individual user.
      parameters:
        - in: header
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
                - date
              properties:
                name:
                  type: string
                description:
                  type: string
                date:
                  type: string
            example:
              name: "string"
              description: "string"
              date: "01/01/2027"
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  studyReminderId:
                    type: integer
              example:
                studyReminderId: 1
        '400':
          description: >
            Name and description must be strings between 4 and 100 characters in length.<br>
            Date cannot be in the past and must be of the form DD/MM/YYYY.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "string"
        '401':
          description: User is unauthenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "string"
  /v2/courses/{courseId}/studyReminders:
    post:
      tags: [Courses]
      summary: Create a new study reminder for a course
      description: Create a new study reminder for a course which is accessible for all students in a course. User must be a staff member of the course or a site administrator. 
      parameters:
        - in: header
          name: token
          required: true
          schema:
            type: string
        - in: path
          name: courseId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - description
                - date
              properties:
                name:
                  type: string
                description:
                  type: string
                date:
                  type: string
            example:
              name: "string"
              description: "string"
              date: "01/01/2027"
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  courseStudyReminderId:
                    type: integer
              example:
                courseStudyReminderId: 1
        '400':
          description: >
            Course ID given does not exist. <br>
            Name and description must be strings between 4 and 100 characters in length.<br>
            Date cannot be in the past and must be of the form DD/MM/YYYY.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "string"
        '401':
          description: User is unauthenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "string"
        '403':
          description: User must be a site administrator or a staff member of the given course.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: "string"
components:
  schemas: {}
  headers: {}
  responses: {}
  parameters: {}

